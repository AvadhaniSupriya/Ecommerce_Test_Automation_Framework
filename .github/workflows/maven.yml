name: Ecommerce_Test_Automation_Workflow

on:
  schedule:
    - cron: 30 18 * * *
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Running Test Automation Framework with Maven
      run: mvn test -Dbrowser=chrome -DisLambdaTest=false -DisHeadless=false

    - name: Upload Test Logs
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: Test logs
        path: logs/
        if-no-files-found: ignore

    - name: Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: screenshot
        path: screenshot/
        if-no-files-found: ignore

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: Test Reports
        path: report.html
        if-no-files-found: ignore

    - name: Test Execution Status
      if: always()
      run: echo "Test Execution Completed"

    - name: Copy Report to gh-pages Folder
      if: always()
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        New-Item -ItemType Directory -Force -Path public/extent-reports | Out-Null
        if (Test-Path report.html) { Copy-Item report.html public/extent-reports/ -Force }
        if (Test-Path screenshot) { Copy-Item screenshot -Destination public/extent-reports/ -Recurse -Force }
        Get-ChildItem -Recurse

    - name: Deploy
      if: always()
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: public/extent-reports/
        token: ${{ secrets.PAT123 }}
        clean: true
